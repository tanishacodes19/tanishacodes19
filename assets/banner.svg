<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tanisha Agarwal banner</title>
<desc>A dark charcoal banner with a circular landscape window showing mountains, pine trees and birds, with the name Tanisha Agarwal below it.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5a6472"/>
    <stop offset="100%" stop-color="#8b95a3"/>
  </linearGradient>
  <clipPath id="circleClip">
    <circle cx="340" cy="120" r="95"/>
  </clipPath>
</defs>

<rect x="0" y="0" width="680" height="300" rx="20" fill="#1a1a1a"/>

<g clip-path="url(#circleClip)">
  <rect x="245" y="25" width="190" height="190" fill="url(#sky)"/>

  <path d="M270 60 L300 75 L280 90 L310 100 L340 70 L370 95 L400 80 L410 65" fill="none" stroke="#c9ccd1" stroke-width="1" opacity="0.6"/>

  <polygon points="245,150 300,90 340,140 370,110 435,150 435,215 245,215" fill="#3a4048"/>
  <polygon points="245,170 320,120 360,150 435,120 435,215 245,215" fill="#2a2e34" opacity="0.85"/>

  <g fill="#20242a">
    <polygon points="275,150 285,110 295,150"/>
    <polygon points="278,160 288,125 298,160"/>
    <polygon points="310,155 322,105 334,155"/>
    <polygon points="313,165 325,120 337,165"/>
    <polygon points="355,150 365,115 375,150"/>
    <polygon points="358,160 368,128 378,160"/>
    <polygon points="390,155 402,110 414,155"/>
    <polygon points="393,165 405,124 417,165"/>
  </g>

  <rect x="245" y="180" width="190" height="35" fill="#181b1f"/>
</g>

<circle cx="340" cy="120" r="95" fill="none" stroke="#3a3a3a" stroke-width="2"/>

<text x="340" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#e5e5e5">Tanisha Agarwal</text>
</svg>
